# --- 1. 网络与安全配置 ---
# 允许所有网络接口连接（容器环境内部通信必须）
bind 0.0.0.0

# 密码认证（留空则无密码，推荐配置密码以防未授权访问）
# 注意：密码由 .env 的 REDIS_PASSWORD 经命令行参数传入（见 docker-compose.yml），
# 此处不重复配置，避免改密码时两处不一致
# requirepass redis_pass

# --- 2. 内存管理优化 ---
# 设置 Redis 最大使用内存（开发环境建议 256M~512M）
maxmemory 256mb

# 内存达到上限后的淘汰策略（volatile-lru: 移除设置了过期时间的冷数据，最常用）
maxmemory-policy volatile-lru

# --- 3. 持久化策略 (AOF + RDB) ---
# 开启 AOF 持久化，防止容器重启丢失数据
appendonly yes
appendfilename "appendonly.aof"
# 每秒同步一次磁盘，兼顾性能与安全
appendfsync everysec

# RDB 动态快照触发条件
save 900 1
save 300 10
save 60 10000