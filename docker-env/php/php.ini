[PHP]
; 每个PHP脚本最大可占用内存，超出则脚本终止
memory_limit = 256M
; 脚本最大执行时间（秒），超时后脚本被强制终止，0表示无限制
max_execution_time = 60
; 单个上传文件的最大体积
upload_max_filesize = 20M
; POST 请求体最大体积（需 >= upload_max_filesize）
post_max_size = 20M
; 默认时区，避免日期函数报 Warning
date.timezone = Asia/Shanghai

; Session 存储引擎设为 Redis
session.save_handler = redis
; Redis 连接地址：容器内直接用服务名 redis，固定端口6379
session.save_path = "tcp://redis:6379"
; Session 服务端垃圾回收有效期（秒），过期数据可能被清理
session.gc_maxlifetime = 3600
; 浏览器端 Session Cookie 有效期（秒），0 表示浏览器关闭即失效
session.cookie_lifetime = 3600
; 禁止 JavaScript 读取 Session Cookie，防止 XSS 窃取
session.cookie_httponly = On
; 开启 Session 严格模式，防止会话固定攻击（拒绝未初始化的 Session ID）
session.use_strict_mode = On
; 是否仅通过 HTTPS 传输 Session Cookie（生产环境应设为 On）
session.cookie_secure = Off

[opcache]
; 开启 OPcache，将预编译的脚本字节码缓存到内存，提升性能
opcache.enable = 1
; OPcache 共享内存大小（MB），存储编译后的脚本
opcache.memory_consumption = 64
; 最多缓存多少个 PHP 源文件（0 表示无限制）
opcache.max_accelerated_files = 10000
