; =========================================
; Redis Extension Configuration
; =========================================

; --- 1. Session 锁配置 (防止并发请求击穿 & Session 丢失) ---
; 开启 Session 互斥锁，高并发下极为重要
redis.session.locking_enabled = 1
; 获取锁失败时的重试等待时间 (单位: 微秒 us，20000us = 20ms)
redis.session.lock_wait_time = 20000
; 最大重试次数 (-1 表示无限重试直到超时)
redis.session.lock_retries = -1
; 锁的自动过期释放时间 (单位: 秒)，防止进程崩溃死锁
redis.session.lock_expire = 30

; --- 2. 序列化与压缩 (提升网络传输与存储效率) ---
; 默认序列化器 (php, php_serialize, igbinary, json, msgpack)
; 提示：若安装了 igbinary 扩展推荐设为 igbinary，没有则留空使用默认 php
redis.pconnect.echo_check_liveness = 1

; --- 3. 连接与超时参数 ---
; 建立连接的默认超时时间 (单位: 秒)
redis.arrays.connecttimeout = 5
; 读写数据流的默认超时时间 (单位: 秒)
redis.arrays.readtimeout = 5

; --- 4. 调试与错误处理 ---
; 当 Redis 抛出异常时不直接打断，保留精准报错信息
redis.pconnect.pooling_enabled = 1